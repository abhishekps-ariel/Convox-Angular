<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="max-w-md w-full space-y-8 p-8 bg-white rounded-xl shadow-lg border border-gray-200">
    <div class="text-center">
      <h2 class="text-3xl font-bold text-gray-900 mb-2">
        Welcome to Convo<span class="text-indigo-600 text-4xl">X</span>
      </h2>
      <p class="text-gray-600">Sign in to start chatting</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
          Email Address
        </label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          class="block w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
          required
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
          Password
        </label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          class="block w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
          required
        />
      </div>

      <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-md text-sm">
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        [disabled]="isSubmitting"
        class="w-full flex justify-center py-3 px-4 rounded-md text-white bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50"
      >
        {{ isSubmitting ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <div class="text-center">
      <p class="text-gray-600">
        Don't have an account?
        <button
          (click)="onToggleMode()"
          type="button"
          class="text-indigo-600 hover:text-indigo-500 font-medium"
        >
          Sign up
        </button>
      </p>
    </div>
  </div>
</div>
