<div class="flex h-full w-full bg-white">
  <!-- Left Sidebar -->
  <app-left-sidebar
    [selectedUser]="selectedUser"
    [conversations]="conversations"
    [allUsers]="allUsers"
    [onlineUsers]="onlineUsers"
    (userSelect)="onUserSelect($event)"
    (conversationsChange)="onConversationsChange($event)"
    (allUsersChange)="onAllUsersChange($event)"
  ></app-left-sidebar>
  
  <!-- Main Chat Area -->
  <div class="flex-1 flex flex-col bg-white">
    <!-- No Chat Selected -->
    <div *ngIf="!selectedUser && !selectedGroup" class="flex-1 flex flex-col items-center justify-center text-center px-6">
      <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mb-6">
        <svg
          class="w-10 h-10 text-gray-400"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            strokeLinecap="round"
            strokeLinejoin="round"
            strokeWidth="2"
            d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"
          />
        </svg>
      </div>
      <h3 class="text-2xl font-bold text-gray-900 mb-2">
        Welcome to ConvoX
      </h3>
      <p class="text-gray-600 max-w-md">
        Select a conversation from the sidebar or search for users to
        start chatting. Your messages will appear here once you start a
        conversation.
      </p>
    </div>

    <!-- Selected User Chat -->
    <ng-container *ngIf="selectedUser">
      <app-chat-header
        [selectedUser]="selectedUser"
        [onlineUsers]="onlineUsers"
      ></app-chat-header>
      
      <app-message-area
        [messages]="messages"
        [isGroupChat]="false"
      ></app-message-area>

      <app-input-message
        [newMessage]="newMessage"
        [selectedImage]="selectedImage"
        [selectedVideo]="selectedVideo"
        [isUploading]="isUploading"
        [disabled]="false"
        (messageChange)="onMessageChange($event)"
        (sendMessage)="onSendMessage()"
        (imageSelect)="onImageSelect($event)"
        (videoSelect)="onVideoSelect($event)"
        (sendImage)="onSendImage()"
        (sendVideo)="onSendVideo()"
        (removeSelectedImage)="onRemoveSelectedImage()"
        (removeSelectedVideo)="onRemoveSelectedVideo()"
      ></app-input-message>
    </ng-container>

    <!-- Selected Group Chat (placeholder) -->
    <ng-container *ngIf="selectedGroup">
      <div class="px-6 py-4 border-b border-gray-200 bg-white">
        <h3 class="text-lg font-semibold text-gray-900">
          {{ selectedGroup.name }}
        </h3>
      </div>
      
      <app-message-area
        [messages]="messages"
        [isGroupChat]="true"
      ></app-message-area>

      <app-input-message
        [newMessage]="newMessage"
        [selectedImage]="selectedImage"
        [selectedVideo]="selectedVideo"
        [isUploading]="isUploading"
        [disabled]="false"
        (messageChange)="onMessageChange($event)"
        (sendMessage)="onSendMessage()"
        (imageSelect)="onImageSelect($event)"
        (videoSelect)="onVideoSelect($event)"
        (sendImage)="onSendImage()"
        (sendVideo)="onSendVideo()"
        (removeSelectedImage)="onRemoveSelectedImage()"
        (removeSelectedVideo)="onRemoveSelectedVideo()"
      ></app-input-message>
    </ng-container>
  </div>
</div>
