<div class="flex h-full w-full bg-white">
  <!-- Left Sidebar -->
  <app-left-sidebar
    [selectedUser]="selectedUser"
    [selectedGroup]="selectedGroup"
    [conversations]="conversations"
    [allUsers]="allUsers"
    [onlineUsers]="onlineUsers"
    (userSelect)="onUserSelect($event)"
    (groupSelect)="onGroupSelect($event)"
    (conversationsChange)="onConversationsChange($event)"
    (allUsersChange)="onAllUsersChange($event)"
    (groupsChange)="onGroupsChange($event)"
  ></app-left-sidebar>
  
  <!-- No Chat Selected -->
  <div
    *ngIf="!selectedUser && !selectedGroup"
    class="flex-1 flex flex-col items-center justify-center text-center px-6"
  >
    <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mb-6">
      <svg
        class="w-10 h-10 text-gray-400"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          strokeLinecap="round"
          strokeLinejoin="round"
          strokeWidth="2"
          d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"
        />
      </svg>
    </div>
    <h3 class="text-2xl font-bold text-gray-900 mb-2">Welcome to ConvoX</h3>
    <p class="text-gray-600 max-w-md">
      Select a conversation from the sidebar or search for users to
      start chatting. Your messages will appear here once you start a
      conversation.
    </p>
  </div>

  <!-- Selected User Chat - EXACT React pattern -->
  <div *ngIf="selectedUser" class="flex-1 flex flex-col bg-white">
    <app-chat-header
      [selectedUser]="selectedUser"
      [onlineUsers]="onlineUsers"
      (blockUser)="onBlockUser()"
    ></app-chat-header>
    
    <app-message-area
      [messages]="messages"
      [isGroupChat]="false"
      [forceScrollToBottom]="forceScrollToBottom"
      (editMessage)="onEditMessage($event)"
      (deleteForMe)="onDeleteForMe($event)"
      (deleteForEveryone)="onDeleteForEveryone($event)"
      (openImageViewer)="openImageViewer($event)"
      (openVideoViewer)="openVideoViewer($event)"
    ></app-message-area>

    <app-input-message
      [newMessage]="newMessage"
      [selectedImage]="selectedImage"
      [selectedVideo]="selectedVideo"
      [isUploading]="isUploading"
      [disabled]="false"
      (messageChange)="onMessageChange($event)"
      (sendMessage)="onSendMessage()"
      (imageSelect)="onImageSelect($event)"
      (videoSelect)="onVideoSelect($event)"
      (sendImage)="onSendImage()"
      (sendVideo)="onSendVideo()"
      (removeSelectedImage)="onRemoveSelectedImage()"
      (removeSelectedVideo)="onRemoveSelectedVideo()"
    ></app-input-message>
  </div>

  <!-- Selected Group Chat - EXACT React pattern -->
  <div *ngIf="selectedGroup" class="flex-1 flex flex-col bg-white">
      <!-- Group Header -->
      <div class="px-6 py-4 border-b border-gray-200 bg-white">
        <div class="flex items-center justify-between">
          <div class="flex items-center">
            <img
              *ngIf="selectedGroup.icon"
              [src]="selectedGroup.icon"
              [alt]="selectedGroup.name"
              class="w-10 h-10 rounded-full object-cover mr-3"
            />
            <div
              *ngIf="!selectedGroup.icon"
              class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center text-green-600 font-semibold mr-3"
            >
              {{ selectedGroup.name.charAt(0).toUpperCase() }}
            </div>
            <div>
              <h2 class="text-lg font-semibold text-gray-900">{{ selectedGroup.name }}</h2>
              <p class="text-sm text-gray-500">
                {{ selectedGroup.members.length }} members
              </p>
            </div>
          </div>
          <app-group-menu
            [group]="selectedGroup"
            [currentUser]="user!"
            [onlineUsers]="onlineUsers"
            (leaveGroup)="onLeaveGroup($event)"
            (addMembers)="onAddMembers($event)"
          ></app-group-menu>
        </div>
      </div>
      
      <app-message-area
        [messages]="messages"
        [isGroupChat]="true"
        [forceScrollToBottom]="forceScrollToBottom"
        (editMessage)="onEditMessage($event)"
        (deleteForMe)="onDeleteForMe($event)"
        (deleteForEveryone)="onDeleteForEveryone($event)"
        (openImageViewer)="openImageViewer($event)"
        (openVideoViewer)="openVideoViewer($event)"
      ></app-message-area>

      <app-input-message
        [newMessage]="newMessage"
        [selectedImage]="selectedImage"
        [selectedVideo]="selectedVideo"
        [isUploading]="isUploading"
        [disabled]="false"
        (messageChange)="onMessageChange($event)"
        (sendMessage)="onSendMessage()"
        (imageSelect)="onImageSelect($event)"
        (videoSelect)="onVideoSelect($event)"
        (sendImage)="onSendImage()"
        (sendVideo)="onSendVideo()"
        (removeSelectedImage)="onRemoveSelectedImage()"
        (removeSelectedVideo)="onRemoveSelectedVideo()"
      ></app-input-message>
  </div>
</div>

<!-- Add Members Modal -->
<app-add-members-modal
  *ngIf="showAddMembersModal && selectedGroup"
  [isOpen]="showAddMembersModal"
  [group]="selectedGroup"
  [currentUserId]="user?.id || ''"
  [token]="token || ''"
  (close)="onAddMembersModalClose()"
  (membersAdded)="onMembersAdded()"
></app-add-members-modal>

<!-- Image Viewer Modal - EXACT React pattern -->
<div
  *ngIf="viewingImage"
  class="fixed inset-0 bg-black/50 backdrop-blur-md z-50 flex items-center justify-center p-4"
  (click)="closeImageViewer()"
>
  <div class="relative max-w-full max-h-full">
    <!-- Close button -->
    <button
      (click)="closeImageViewer()"
      class="absolute top-4 right-4 z-10 bg-black bg-opacity-50 text-white rounded-full p-2 hover:bg-opacity-70 transition-all"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
    
    <!-- Image -->
    <img
      [src]="viewingImage"
      alt="Full size image"
      class="max-w-full max-h-full object-contain rounded-lg"
      (click)="$event.stopPropagation()"
    />
    
    <!-- Download button -->
    <button
      (click)="downloadImage(viewingImage)"
      class="absolute bottom-4 right-4 z-10 bg-black bg-opacity-50 text-white rounded-full p-2 hover:bg-opacity-70 transition-all"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
    </button>
  </div>
</div>

<!-- Video Viewer Modal - EXACT React pattern -->
<div
  *ngIf="viewingVideo"
  class="fixed inset-0 bg-black/50 backdrop-blur-md z-50 flex items-center justify-center p-4"
  (click)="closeVideoViewer()"
>
  <div class="relative max-w-full max-h-full">
    <!-- Close button -->
    <button
      (click)="closeVideoViewer()"
      class="absolute top-4 right-4 z-10 bg-black bg-opacity-50 text-white rounded-full p-2 hover:bg-opacity-70 transition-all"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
    
    <!-- Video -->
    <video
      [src]="viewingVideo"
      class="max-w-full max-h-full object-contain rounded-lg"
      controls
      autoplay
      (click)="$event.stopPropagation()"
    ></video>
    
    <!-- Download button -->
    <button
      (click)="downloadVideo(viewingVideo)"
      class="absolute bottom-4 right-4 z-10 bg-black bg-opacity-50 text-white rounded-full p-2 hover:bg-opacity-70 transition-all"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
    </button>
  </div>
</div>
