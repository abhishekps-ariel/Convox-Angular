<div #messagesContainer class="px-6 py-4 h-full relative">
  <div *ngFor="let message of messages; let i = index">
    <ng-container *ngIf="!isMessageDeleted(message)">
      
      <!-- Date Separator -->
      <div 
        *ngIf="shouldShowDateSeparator(message.createdAt, i > 0 ? messages[i-1].createdAt : null)"
        class="flex justify-center my-6"
      >
        <div class="bg-gray-100 text-gray-600 px-4 py-2 rounded-full text-sm font-medium">
          {{ formatMessageDate(message.createdAt) }}
        </div>
      </div>

      <!-- System Message -->
      <div *ngIf="message.messageType === 'system'" class="flex justify-center mb-4">
        <div class="bg-gray-100 text-gray-600 px-4 py-2 rounded-full text-sm italic max-w-[70%] text-center">
          {{ message.text }}
        </div>
      </div>

      <!-- Regular Message -->
      <div *ngIf="message.messageType !== 'system'">
        <!-- Sender Name (for group chats) -->
        <div 
          *ngIf="shouldShowSenderName(message, i > 0 ? messages[i-1] : null)"
          [class]="'flex mb-1 ' + (message.sender._id === user?.id ? 'justify-end' : 'justify-start')"
        >
          <div class="text-xs text-gray-500 px-2">
            {{ message.sender._id === user?.id ? 'You' : message.sender.username }}
          </div>
        </div>

        <!-- Message Bubble -->
        <div
          [class]="'flex mb-4 ' + (message.sender._id === user?.id ? 'justify-end' : 'justify-start')"
        >
          <div class="relative group max-w-[70%]">
            <div
              [class]="'px-4 py-3 rounded-2xl break-words shadow-sm ' +
                (message.sender._id === user?.id
                  ? 'bg-gray-900 text-white rounded-br-md'
                  : 'bg-white text-gray-900 rounded-bl-md border border-gray-200 shadow-sm')"
            >
              <!-- Deleted Message -->
              <div *ngIf="message.deletedForEveryone" class="flex items-center text-gray-400 italic">
                <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20">
                  <path fillRule="evenodd" d="M13.477 14.89A6 6 0 015.11 6.524l8.367 8.368zm1.414-1.414L6.524 5.11a6 6 0 018.367 8.367zM18 10a8 8 0 11-16 0 8 8 0 0116 0z" clipRule="evenodd" />
                </svg>
                This message was deleted
              </div>

              <!-- Normal Message -->
              <ng-container *ngIf="!message.deletedForEveryone">
                <!-- Editing Mode -->
                <div *ngIf="editingMessageId === message._id" class="space-y-2">
                  <textarea
                    [(ngModel)]="editText"
                    (keydown)="handleKeyPress($event)"
                    class="w-full bg-transparent border-none outline-none resize-none text-sm leading-relaxed"
                    [rows]="Math.max(1, editText.split('\n').length)"
                    [attr.autofocus]="true"
                  ></textarea>
                  <div class="flex gap-2 justify-end">
                    <button
                      (click)="handleCancelEdit()"
                      [disabled]="isEditing"
                      class="px-3 py-1 text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 rounded transition-colors disabled:opacity-50"
                    >
                      Cancel
                    </button>
                    <button
                      (click)="handleSaveEdit()"
                      [disabled]="isEditing || !editText.trim()"
                      class="px-3 py-1 text-xs bg-gray-800 hover:bg-gray-900 text-white rounded transition-colors disabled:opacity-50"
                    >
                      {{ isEditing ? 'Saving...' : 'Save' }}
                    </button>
                  </div>
                </div>

                <!-- Normal Display Mode -->
                <ng-container *ngIf="editingMessageId !== message._id">
                  <!-- Image Message -->
                  <div *ngIf="message.messageType === 'image' && message.imageUrl" class="mb-2">
                    <img
                      [src]="message.imageUrl"
                      alt="Shared image"
                      class="max-w-full h-auto max-h-64 rounded-lg cursor-pointer object-cover hover:opacity-90 transition-opacity"
                    />
                  </div>

                  <!-- Video Message -->
                  <div *ngIf="message.messageType === 'video' && message.videoUrl" class="mb-2">
                    <video
                      [src]="message.videoUrl"
                      class="max-w-full h-auto max-h-64 rounded-lg cursor-pointer object-cover"
                      controls
                    ></video>
                  </div>

                  <!-- Text Message -->
                  <p *ngIf="message.messageType === 'text'" class="text-sm leading-relaxed">
                    {{ message.text }}
                  </p>

                  <!-- Message Footer (Time + Read Status) -->
                  <div class="flex items-center justify-between mt-2">
                    <span
                      [class]="'text-xs ' + (message.sender._id === user?.id ? 'text-gray-300' : 'text-gray-500')"
                    >
                      {{ formatTime(message.createdAt) }}
                      <span *ngIf="message.isEdited" class="ml-1 italic">(edited)</span>
                    </span>

                    <!-- Message Actions for Sent Messages -->
                    <div *ngIf="message.sender._id === user?.id" class="flex items-center space-x-2">
                      <!-- Read Status for Direct Messages -->
                      <div *ngIf="!message.group" class="flex items-center">
                        <!-- Double Blue Tick (Read) -->
                        <div *ngIf="message.isRead" class="flex">
                          <svg class="w-3 h-3 text-blue-500" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
                          </svg>
                          <svg class="w-3 h-3 text-blue-500 -ml-1" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
                          </svg>
                        </div>
                        <!-- Single Gray Tick (Sent) -->
                        <svg *ngIf="!message.isRead" class="w-4 h-3 text-gray-400" fill="currentColor" viewBox="0 0 24 24">
                          <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
                        </svg>
                      </div>

                    </div>
                  </div>
                </ng-container>
              </ng-container>
              
              <!-- Floating Three Dots Button - appears on hover -->
              <div *ngIf="!isMessageDeleted(message) && !message.deletedForEveryone && canDeleteMessage(message) && editingMessageId !== message._id" 
                   class="absolute -top-1 -right-1 opacity-0 group-hover:opacity-100 transition-opacity duration-200">
                <div class="relative">
                  <button
                    (click)="toggleDeleteMenu(message._id)"
                    class="bg-white hover:bg-gray-50 text-gray-500 hover:text-gray-700 rounded-full p-1.5 shadow-sm border border-gray-200"
                    title="Message options"
                    style="z-index: 9999"
                  >
                    <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24">
                      <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                    </svg>
                  </button>
                  
                  <!-- Context Menu Dropdown -->
                  <div *ngIf="showDeleteMenu === message._id" 
                       [class]="'absolute bottom-8 bg-white border border-gray-200 rounded-lg shadow-lg py-2 z-50 min-w-48 ' +
                                (message.sender._id === user?.id ? 'right-0' : 'left-0')">
                    <!-- Edit option - only show for own messages that can be edited -->
                    <button
                      *ngIf="message.sender._id === user?.id && canEditMessage(message)"
                      (click)="handleEditMessage(message)"
                      class="w-full px-4 py-2 text-left text-sm text-gray-700 hover:bg-gray-100 flex items-center"
                    >
                      <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                      </svg>
                      Edit message
                    </button>
                    
                    <!-- Delete for me option -->
                    <button
                      (click)="onDeleteForMe(message._id)"
                      class="w-full px-4 py-2 text-left text-sm text-gray-700 hover:bg-gray-100 flex items-center"
                    >
                      <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                      </svg>
                      Delete for me
                    </button>
                    
                    <!-- Delete for everyone option -->
                    <button
                      *ngIf="canDeleteForEveryone(message)"
                      (click)="onDeleteForEveryone(message._id)"
                      class="w-full px-4 py-2 text-left text-sm text-red-600 hover:bg-red-50 flex items-center"
                    >
                      <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                      </svg>
                      Delete for everyone
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </ng-container>
  </div>
  
  <!-- Scroll anchor -->
  <div #messagesEnd></div>
</div>
