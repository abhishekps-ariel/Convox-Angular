<div *ngIf="isOpen" class="fixed inset-0 bg-transparent backdrop-blur-md flex items-center justify-center z-50">
  <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4 max-h-[90vh] overflow-y-auto border border-gray-200">
    <!-- Header -->
    <div class="flex items-center justify-between p-6 border-b border-gray-200">
      <h2 class="text-xl font-semibold text-gray-900">Edit Profile</h2>
      <button
        (click)="onClose()"
        type="button"
        class="text-gray-400 hover:text-gray-600 transition-colors"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Content -->
    <div class="p-6 space-y-6">
      <!-- Profile Picture -->
      <div class="flex flex-col items-center space-y-4">
        <div class="relative">
          <div class="w-24 h-24 rounded-full overflow-hidden bg-gray-200 flex items-center justify-center">
            <img
              *ngIf="previewUrl || profilePicture"
              [src]="previewUrl || profilePicture"
              alt="Profile"
              class="w-full h-full object-cover"
            />
            <span *ngIf="!previewUrl && !profilePicture" class="text-2xl font-medium text-gray-600">
              {{ (user?.username || '').charAt(0).toUpperCase() }}
            </span>
          </div>
          <button
            *ngIf="previewUrl || profilePicture"
            (click)="handleRemoveProfilePicture()"
            type="button"
            class="absolute -top-2 -right-2 w-6 h-6 bg-red-500 text-white rounded-full flex items-center justify-center text-xs hover:bg-red-600"
          >
            ×
          </button>
        </div>
        
        <div class="flex space-x-2">
          <input
            #fileInput
            type="file"
            accept="image/*"
            (change)="onFileSelected($event)"
            class="hidden"
          />
          <button
            (click)="fileInput.click()"
            type="button"
            class="px-4 py-2 text-sm font-medium text-blue-600 bg-blue-50 rounded-lg hover:bg-blue-100 transition-colors"
          >
            {{ (previewUrl || profilePicture) ? 'Change Photo' : 'Add Photo' }}
          </button>
        </div>
      </div>

      <!-- Bio -->
      <div>
        <label for="bio" class="block text-sm font-medium text-gray-700 mb-2">
          Bio
        </label>
        <textarea
          id="bio"
          [(ngModel)]="bio"
          placeholder="Tell us about yourself..."
          maxlength="150"
          rows="3"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 resize-none"
        ></textarea>
        <div class="text-right text-xs text-gray-500 mt-1">
          {{ bio.length }}/150
        </div>
      </div>

      <!-- Username and Email (Read-only) -->
      <div class="space-y-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Username
          </label>
          <input
            type="text"
            [value]="user?.username || ''"
            disabled
            class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-50 text-gray-500"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Email
          </label>
          <input
            type="email"
            [value]="user?.email || ''"
            disabled
            class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-50 text-gray-500"
          />
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="p-6 border-t border-gray-200">
      <div class="flex space-x-3">
        <button
          (click)="onClose()"
          type="button"
          class="flex-1 px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors"
        >
          Cancel
        </button>
        <button
          (click)="handleSave()"
          [disabled]="isLoading"
          type="button"
          class="flex-1 px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
        >
          {{ isLoading ? 'Saving...' : 'Save Changes' }}
        </button>
      </div>
    </div>
  </div>
</div>
