<div *ngIf="isOpen && group" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4 max-h-[80vh] flex flex-col">
    <!-- Header -->
    <div class="flex items-center justify-between p-6 border-b border-gray-200">
      <h2 class="text-xl font-semibold text-gray-900">Add Members</h2>
      <button
        (click)="onClose()"
        class="text-gray-400 hover:text-gray-600 transition-colors"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Content -->
    <div class="flex-1 overflow-hidden flex flex-col">
      <div class="p-6 border-b border-gray-200">
        <p class="text-sm text-gray-600">
          Add new members to <span class="font-medium">{{ group.name }}</span>
        </p>
      </div>

      <!-- User List -->
      <div class="flex-1 overflow-y-auto p-6">
        <div *ngIf="isLoading" class="flex items-center justify-center py-8">
          <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
        </div>
        
        <div *ngIf="!isLoading && availableUsers.length === 0" class="text-center text-gray-500 py-8">
          No available users to add
        </div>
        
        <div *ngIf="!isLoading && availableUsers.length > 0" class="space-y-2">
          <label
            *ngFor="let user of availableUsers"
            class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer"
          >
            <input
              type="checkbox"
              [id]="'user-' + user.id"
              [checked]="selectedUserIds.includes(user.id)"
              (change)="toggleUser(user.id)"
              class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
            />
            <div class="w-8 h-8 bg-gray-200 rounded-full flex items-center justify-center text-sm font-medium text-gray-600 overflow-hidden">
              <img
                *ngIf="user.profilePicture"
                [src]="user.profilePicture"
                [alt]="user.username"
                class="w-full h-full object-cover"
              />
              <span *ngIf="!user.profilePicture">
                {{ user.username.charAt(0).toUpperCase() }}
              </span>
            </div>
            <div>
              <p class="text-sm font-medium text-gray-900">{{ user.username }}</p>
              <p class="text-xs text-gray-500">{{ user.email }}</p>
            </div>
          </label>
        </div>
      </div>

      <!-- Footer -->
      <div class="p-6 border-t border-gray-200">
        <div class="flex space-x-3">
          <button
            type="button"
            (click)="onClose()"
            class="flex-1 px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors"
          >
            Cancel
          </button>
          <button
            type="button"
            (click)="onSubmit()"
            [disabled]="selectedUserIds.length === 0 || isSubmitting"
            class="flex-1 px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
          >
            {{ isSubmitting ? 'Adding...' : 'Add ' + selectedUserIds.length + ' Member' + (selectedUserIds.length !== 1 ? 's' : '') }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
