<div class="w-80 bg-white flex flex-col overflow-hidden border-r border-gray-200">
  <!-- Search -->
  <div class="px-6 py-4 border-b border-gray-200 relative">
    <div class="relative">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <svg
          class="h-5 w-5 text-gray-400"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
      </div>
      <input
        type="text"
        placeholder="Search users..."
        [value]="searchQuery()"
        (input)="onSearchChange($event)"
        class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md leading-5 bg-white placeholder-gray-500 focus:outline-none focus:placeholder-gray-400 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 text-sm"
      />
    </div>

    <!-- Search Results -->
    <div *ngIf="showSearchResults() && searchQuery()" class="absolute top-full left-6 right-6 bg-white border border-gray-200 rounded-md mt-1 max-h-60 overflow-y-auto z-10 shadow-lg">
      <div *ngFor="let userItem of filteredUsers" 
           (click)="onUserClick(userItem)"
           class="flex items-center p-3 cursor-pointer hover:bg-gray-50 transition duration-200 border-b border-gray-100 last:border-b-0">
        <div class="relative flex-shrink-0">
          <div class="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 font-semibold overflow-hidden">
            <img
              *ngIf="userItem.profilePicture"
              [src]="userItem.profilePicture"
              [alt]="userItem.username"
              class="w-full h-full object-cover"
            />
            <span *ngIf="!userItem.profilePicture">
              {{ userItem.username.charAt(0).toUpperCase() }}
            </span>
          </div>
          <span *ngIf="isUserBlockedByMe(userItem.id)" class="absolute bottom-0 right-0 w-3 h-3 bg-red-500 rounded-full border-2 border-white"></span>
          <span *ngIf="!isUserBlockedByMe(userItem.id) && isUserOnline(userItem.id)" class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-white"></span>
        </div>
        <div class="ml-3 flex-1 overflow-hidden min-w-0">
          <h3 class="font-medium text-gray-900 truncate">
            {{ userItem.username }}
          </h3>
          <p class="text-sm text-gray-500 truncate">
            {{ userItem.email }}
          </p>
        </div>
      </div>
      <div *ngIf="filteredUsers.length === 0" class="p-3 text-gray-500 text-center text-sm">
        No users found
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="px-6 py-2 border-b border-gray-200">
    <div class="flex space-x-1 relative">
      <!-- Highlight animation bar -->
      <div
        class="absolute bottom-0 h-0.5 bg-blue-500 transition-all duration-300 ease-in-out"
        [class]="activeTab() === 'chats' ? 'left-0 w-1/2' : 'left-1/2 w-1/2'"
      ></div>
      
      <button
        (click)="onTabChange('chats')"
        class="relative px-3 py-2 text-sm font-medium rounded-md transition-all duration-300 ease-in-out w-full"
        [class]="activeTab() === 'chats' ? 'text-blue-700' : 'text-gray-500 hover:text-gray-700'"
      >
        Chats
      </button>
      <button
        (click)="onTabChange('groups')"
        class="relative px-3 py-2 text-sm font-medium rounded-md transition-all duration-300 ease-in-out w-full"
        [class]="activeTab() === 'groups' ? 'text-blue-700' : 'text-gray-500 hover:text-gray-700'"
      >
        Groups
      </button>
    </div>
  </div>

  <!-- Groups Tab -->
  <div *ngIf="activeTab() === 'groups'" class="flex-1 overflow-y-auto">
    <div class="px-6 py-3 border-b border-gray-200">
      <button
        (click)="onCreateGroup()"
        class="w-full px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors text-sm font-medium"
      >
        Create New Group
      </button>
    </div>
    <div class="pl-1">
      <!-- GroupList component will be implemented later -->
      <div class="p-4 text-center text-gray-500">
        <p>Group list will be implemented next</p>
      </div>
    </div>
  </div>

  <!-- Conversations Tab -->
  <div *ngIf="activeTab() === 'chats'" class="flex-1 overflow-y-auto">
    <div class="pl-1">
      <!-- ConversationList component will be implemented later -->
      <div class="p-4 text-center text-gray-500">
        <p>Conversation list will be implemented next</p>
      </div>
    </div>
  </div>

  <!-- Create Group Modal -->
  <div *ngIf="showCreateGroupModal()" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4">
      <h2 class="text-xl font-bold mb-4">Create Group</h2>
      <p class="text-gray-600 mb-4">Group creation modal will be implemented later</p>
      <button
        (click)="onCloseCreateGroupModal()"
        class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700"
      >
        Close
      </button>
    </div>
  </div>
</div>
