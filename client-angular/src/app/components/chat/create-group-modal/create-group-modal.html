<div 
  *ngIf="isOpen" 
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
  (click)="onBackdropClick($event)"
>
  <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4 max-h-[90vh] overflow-y-auto">
    <!-- Header -->
    <div class="flex items-center justify-between p-6 border-b border-gray-200">
      <h2 class="text-xl font-semibold text-gray-900">Create New Group</h2>
      <button
        (click)="onClose()"
        class="text-gray-400 hover:text-gray-600 transition-colors"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Form -->
    <div class="p-6 space-y-4">
      <!-- Group Name -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Group Name *
        </label>
        <input
          type="text"
          [(ngModel)]="groupName"
          placeholder="Enter group name"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        />
      </div>

      <!-- Group Description -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Description
        </label>
        <textarea
          [(ngModel)]="groupDescription"
          placeholder="Enter group description (optional)"
          rows="3"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        ></textarea>
      </div>

      <!-- Member Search -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Add Members *
        </label>
        <input
          type="text"
          [(ngModel)]="searchQuery"
          (input)="onSearchChange()"
          placeholder="Search users..."
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        />
      </div>

      <!-- Member List -->
      <div class="max-h-48 overflow-y-auto border border-gray-200 rounded-md">
        <div
          *ngFor="let user of filteredUsers"
          (click)="toggleMember(user.id)"
          class="flex items-center p-3 cursor-pointer hover:bg-gray-50 transition-colors border-b border-gray-100 last:border-b-0"
          [class.bg-blue-50]="isMemberSelected(user.id)"
        >
          <div class="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 font-semibold overflow-hidden mr-3">
            <img
              *ngIf="user.profilePicture"
              [src]="user.profilePicture"
              [alt]="user.username"
              class="w-full h-full object-cover"
            />
            <span *ngIf="!user.profilePicture">
              {{ user.username.charAt(0).toUpperCase() }}
            </span>
          </div>
          <div class="flex-1 min-w-0">
            <h3 class="font-medium text-gray-900 truncate">
              {{ user.username }}
            </h3>
            <p class="text-sm text-gray-500 truncate">
              {{ user.email }}
            </p>
          </div>
          <div class="ml-2">
            <div
              class="w-5 h-5 border-2 rounded"
              [class]="isMemberSelected(user.id) ? 'bg-blue-500 border-blue-500' : 'border-gray-300'"
            >
              <svg
                *ngIf="isMemberSelected(user.id)"
                class="w-3 h-3 text-white"
                fill="currentColor"
                viewBox="0 0 20 20"
              >
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
              </svg>
            </div>
          </div>
        </div>
        <div *ngIf="filteredUsers.length === 0" class="p-3 text-gray-500 text-center">
          No users found
        </div>
      </div>

      <!-- Selected Members Count -->
      <div *ngIf="selectedMembers.length > 0" class="text-sm text-gray-600">
        {{ selectedMembers.length }} member(s) selected
      </div>
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-end gap-3 p-6 border-t border-gray-200">
      <button
        (click)="onClose()"
        class="px-4 py-2 text-gray-700 bg-gray-100 rounded-md hover:bg-gray-200 transition-colors"
      >
        Cancel
      </button>
      <button
        (click)="onCreateGroup()"
        [disabled]="!groupName.trim() || selectedMembers.length === 0"
        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors"
      >
        Create Group
      </button>
    </div>
  </div>
</div>
