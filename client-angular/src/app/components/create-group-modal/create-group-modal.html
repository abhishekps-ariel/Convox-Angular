<div *ngIf="isOpen" class="fixed inset-0 bg-transparent backdrop-blur-md flex items-center justify-center z-50">
  <div class="bg-white rounded-lg p-6 w-full max-w-md mx-4 border border-gray-200">
    <h2 class="text-xl font-semibold mb-4">Create New Group</h2>
    
    <form (ngSubmit)="onSubmit($event)">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Group Name *
        </label>
        <input
          type="text"
          [(ngModel)]="groupName"
          name="groupName"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter group name"
          maxlength="50"
        />
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Description (Optional)
        </label>
        <textarea
          [(ngModel)]="description"
          name="description"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter group description"
          rows="3"
          maxlength="200"
        ></textarea>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Group Icon (Optional)
        </label>
        <div class="flex items-center space-x-4">
          <div class="relative">
            <div *ngIf="groupIcon" class="relative">
              <img
                [src]="groupIcon"
                alt="Group Icon"
                class="w-16 h-16 rounded-full object-cover border-2 border-gray-300"
              />
              <button
                type="button"
                (click)="removeIcon()"
                class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs hover:bg-red-600"
              >
                ×
              </button>
            </div>
            <div
              *ngIf="!groupIcon"
              (click)="fileInput.click()"
              class="w-16 h-16 rounded-full border-2 border-dashed border-gray-300 flex items-center justify-center cursor-pointer hover:border-gray-400"
            >
              <span class="text-gray-400 text-2xl">+</span>
            </div>
            <input
              #fileInput
              type="file"
              accept="image/*"
              (change)="onFileSelected($event)"
              class="hidden"
            />
          </div>
          <div>
            <p class="text-sm text-gray-600">
              {{ groupIcon ? 'Click the × to remove' : 'Click to add group icon' }}
            </p>
            <p class="text-xs text-gray-500">Recommended: 200x200px</p>
          </div>
        </div>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Select Members *
        </label>
        <div class="max-h-40 overflow-y-auto border border-gray-300 rounded-md">
          <label
            *ngFor="let user of users"
            class="flex items-center p-2 hover:bg-gray-50 cursor-pointer"
          >
            <input
              type="checkbox"
              [checked]="selectedMembers.includes(user.id)"
              (change)="toggleMember(user.id)"
              class="mr-3"
            />
            <span class="text-sm">{{ user.username }}</span>
          </label>
        </div>
        <p class="text-xs text-gray-500 mt-1">
          {{ selectedMembers.length }} member(s) selected
        </p>
      </div>

      <div *ngIf="error" class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
        {{ error }}
      </div>

      <div class="flex justify-end space-x-3">
        <button
          type="button"
          (click)="onClose()"
          class="px-4 py-2 text-gray-600 border border-gray-300 rounded-md hover:bg-gray-50"
          [disabled]="isLoading"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 disabled:opacity-50"
          [disabled]="isLoading"
        >
          {{ isLoading ? 'Creating...' : 'Create Group' }}
        </button>
      </div>
    </form>
  </div>
</div>
