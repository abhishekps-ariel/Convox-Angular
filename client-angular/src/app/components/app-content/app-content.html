<div *ngIf="loading()" class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="flex flex-col items-center">
    <div class="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mb-4"></div>
    <div class="text-gray-600 text-lg font-medium">Loading...</div>
  </div>
</div>

<div *ngIf="!loading() && !user()">
  <app-login *ngIf="isLoginMode()" (onToggleMode)="onToggleMode()"></app-login>
  <app-register *ngIf="!isLoginMode()" (onToggleMode)="onToggleMode()"></app-register>
</div>

<div *ngIf="!loading() && user()" class="h-screen w-full flex flex-col overflow-hidden">
  <app-navbar></app-navbar>
  <div class="flex-1 overflow-hidden">
    <!-- ChatInterface will be implemented later -->
    <div class="flex h-full w-full bg-white items-center justify-center">
      <div class="text-center">
        <h2 class="text-2xl font-bold text-gray-900 mb-4">Welcome to ConvoX!</h2>
        <p class="text-gray-600">Chat interface will be implemented next</p>
      </div>
    </div>
  </div>
</div>
