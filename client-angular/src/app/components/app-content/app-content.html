<div *ngIf="loading" class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="flex flex-col items-center">
    <div class="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mb-4"></div>
    <div class="text-gray-600 text-lg font-medium">Loading...</div>
  </div>
</div>

<app-login
  *ngIf="!loading && !user && isLoginMode"
  (toggleMode)="toggleMode()"
></app-login>

<app-register
  *ngIf="!loading && !user && !isLoginMode"
  (toggleMode)="toggleMode()"
></app-register>

<div *ngIf="!loading && user" class="h-screen w-full flex flex-col overflow-hidden">
  <app-navbar></app-navbar>
  <div class="flex-1 overflow-hidden">
    <app-chat-interface></app-chat-interface>
  </div>
</div>
