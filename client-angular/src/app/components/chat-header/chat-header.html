<div class="px-6 py-4 bg-white border-b border-gray-200 sticky top-0 flex items-center justify-between z-20">
  <div class="flex items-center">
    <div class="relative">
      <div class="w-12 h-12 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 font-semibold overflow-hidden">
        <img
          *ngIf="selectedUser?.profilePicture"
          [src]="selectedUser.profilePicture"
          [alt]="selectedUser.username"
          class="w-full h-full object-cover"
        />
        <span *ngIf="!selectedUser?.profilePicture">
          {{ (selectedUser?.username || '').charAt(0).toUpperCase() }}
        </span>
      </div>
      <span
        *ngIf="isBlockedByMe"
        class="absolute bottom-0 right-0 w-3 h-3 bg-red-500 rounded-full border-2 border-white"
      ></span>
      <span
        *ngIf="!isBlockedByMe && isUserOnline(selectedUser.id)"
        class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-white"
      ></span>
    </div>
    <div class="ml-4">
      <h2 class="font-semibold text-gray-900">
        {{ selectedUser.username }}
      </h2>
      <p class="text-sm text-gray-500">
        {{ isBlockedByMe ? 'Blocked by you' : 
           isBlockedByThem ? 'Offline' :
           isUserOnline(selectedUser.id) ? 'Online' : 'Offline' }}
      </p>
    </div>
  </div>

  <!-- Profile Info Button -->
  <button
    *ngIf="selectedUser.id !== user?.id"
    (click)="toggleProfileInfo()"
    type="button"
    class="p-2 hover:bg-gray-100 rounded-full transition-colors"
    title="View profile"
  >
    <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
    </svg>
  </button>
</div>
