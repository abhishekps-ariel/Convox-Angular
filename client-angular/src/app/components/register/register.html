<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="max-w-md w-full space-y-8 p-8 bg-white rounded-xl shadow-lg border border-gray-200">
    <div class="text-center">
      <h2 class="text-3xl font-bold text-gray-900 mb-2">
        Join Convo<span class="text-indigo-600 text-4xl">X</span>
      </h2>
      <p class="text-gray-600">Create your account to start chatting</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
          Username
        </label>
        <input
          id="username"
          formControlName="username"
          type="text"
          placeholder="Choose a username"
          class="block w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
        <div *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched" class="text-red-600 text-sm mt-1">
          <div *ngIf="registerForm.get('username')?.errors?.['required']">
            Username is required
          </div>
          <div *ngIf="registerForm.get('username')?.errors?.['minlength']">
            At least 3 characters
          </div>
        </div>
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
          Email Address
        </label>
        <input
          id="email"
          formControlName="email"
          type="email"
          placeholder="Enter your email"
          class="block w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
        <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="text-red-600 text-sm mt-1">
          <div *ngIf="registerForm.get('email')?.errors?.['required']">
            Email is required
          </div>
          <div *ngIf="registerForm.get('email')?.errors?.['email']">
            Invalid email
          </div>
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
          Password
        </label>
        <input
          id="password"
          formControlName="password"
          type="password"
          placeholder="Create a password"
          class="block w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
        <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="text-red-600 text-sm mt-1">
          <div *ngIf="registerForm.get('password')?.errors?.['required']">
            Password is required
          </div>
          <div *ngIf="registerForm.get('password')?.errors?.['minlength']">
            At least 6 characters
          </div>
        </div>
      </div>

      <div>
        <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">
          Confirm Password
        </label>
        <input
          id="confirmPassword"
          formControlName="confirmPassword"
          type="password"
          placeholder="Confirm your password"
          class="block w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
        <div *ngIf="registerForm.get('confirmPassword')?.invalid && registerForm.get('confirmPassword')?.touched" class="text-red-600 text-sm mt-1">
          <div *ngIf="registerForm.get('confirmPassword')?.errors?.['required']">
            Confirm your password
          </div>
          <div *ngIf="registerForm.get('confirmPassword')?.errors?.['passwordMismatch']">
            Passwords do not match
          </div>
        </div>
      </div>

      <div *ngIf="status()" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-md text-sm">
        {{ status() }}
      </div>

      <button
        type="submit"
        [disabled]="isSubmitting() || registerForm.invalid"
        class="w-full flex justify-center py-3 px-4 rounded-md text-white bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50"
      >
        {{ isSubmitting() ? 'Creating account...' : 'Create Account' }}
      </button>
    </form>

    <div class="text-center">
      <p class="text-gray-600">
        Already have an account? 
        <button
          (click)="onToggle()"
          class="text-indigo-600 hover:text-indigo-500 font-medium"
        >
          Sign in
        </button>
      </p>
    </div>
  </div>
</div>
