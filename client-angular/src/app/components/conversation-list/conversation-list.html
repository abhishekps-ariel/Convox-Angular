<div *ngIf="conversations.length === 0" class="p-4 text-center text-gray-500 text-sm">
  No conversations yet. Search for users to start chatting.
</div>

<div *ngFor="let conv of conversations" 
     (click)="onConversationClick(conv)"
     [class]="'flex items-center p-4 cursor-pointer transition-colors border-b border-gray-100 ' + 
              (selectedUser?.id === conv._id ? 'bg-indigo-50 border-l-4 border-l-indigo-600' : 'hover:bg-gray-50')">
  
  <div class="relative flex-shrink-0">
    <div class="w-12 h-12 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 font-semibold overflow-hidden">
      <img
        *ngIf="conv.profilePicture"
        [src]="conv.profilePicture"
        [alt]="conv.username"
        class="w-full h-full object-cover"
      />
      <span *ngIf="!conv.profilePicture">
        {{ (conv.username || '').charAt(0).toUpperCase() }}
      </span>
    </div>
    
    <!-- Online/Blocked indicator -->
    <span
      *ngIf="isUserBlockedByMe(conv._id)"
      class="absolute bottom-0 right-0 w-3 h-3 bg-red-500 rounded-full border-2 border-white"
    ></span>
    <span
      *ngIf="!isUserBlockedByMe(conv._id) && isUserOnline(conv._id)"
      class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-white"
    ></span>
  </div>

  <div class="ml-3 flex-1 overflow-hidden min-w-0">
    <div class="flex items-center justify-between mb-1">
      <h3 class="font-semibold text-gray-900 truncate">
        {{ conv.username }}
      </h3>
      <span *ngIf="conv.lastMessage" class="text-xs text-gray-500 flex-shrink-0 ml-2">
        {{ formatLastMessageTime(conv.lastMessage.createdAt) }}
      </span>
    </div>
    
    <div class="flex items-center justify-between">
      <p class="text-sm text-gray-600 truncate">
        {{ getLastMessagePreview(conv) }}
      </p>
      <span
        *ngIf="conv.unreadCount > 0"
        class="ml-2 flex-shrink-0 bg-indigo-600 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center"
      >
        {{ conv.unreadCount > 9 ? '9+' : conv.unreadCount }}
      </span>
    </div>
  </div>
</div>
