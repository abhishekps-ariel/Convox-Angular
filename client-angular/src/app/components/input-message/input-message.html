<!-- Image Preview -->
<div *ngIf="selectedImage" class="px-6 py-2 bg-gray-50 border-t border-gray-200">
  <div class="flex items-center space-x-3">
    <div class="relative">
      <img
        [src]="selectedImage"
        alt="Preview"
        class="w-16 h-16 object-cover rounded-lg"
      />
      <button
        (click)="onRemoveImage()"
        type="button"
        class="absolute -top-2 -right-2 w-6 h-6 bg-red-500 text-white rounded-full flex items-center justify-center text-xs hover:bg-red-600"
      >
        ×
      </button>
    </div>
    <div class="flex-1">
      <p class="text-sm text-gray-600">Image selected</p>
      <p class="text-xs text-gray-500">Click send to share</p>
    </div>
    <button
      (click)="onSendImage()"
      [disabled]="isUploading"
      type="button"
      class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed text-sm"
    >
      {{ isUploading ? 'Sending...' : 'Send' }}
    </button>
  </div>
</div>

<!-- Video Preview -->
<div *ngIf="selectedVideo" class="px-6 py-2 bg-gray-50 border-t border-gray-200">
  <div class="flex items-center space-x-3">
    <div class="relative">
      <video
        [src]="selectedVideo"
        class="w-16 h-16 object-cover rounded-lg"
        muted
      ></video>
      <button
        (click)="onRemoveVideo()"
        type="button"
        class="absolute -top-2 -right-2 w-6 h-6 bg-red-500 text-white rounded-full flex items-center justify-center text-xs hover:bg-red-600"
      >
        ×
      </button>
    </div>
    <div class="flex-1">
      <p class="text-sm text-gray-600">Video selected</p>
      <p class="text-xs text-gray-500">Click send to share</p>
    </div>
    <button
      (click)="onSendVideo()"
      [disabled]="isUploading"
      type="button"
      class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed text-sm"
    >
      {{ isUploading ? 'Sending...' : 'Send' }}
    </button>
  </div>
</div>

<!-- Input Form -->
<form
  (ngSubmit)="onSubmit($event)"
  class="px-6 py-4 bg-white border-t border-gray-200 flex items-center space-x-3"
>
  <div class="flex-1 relative">
    <input
      type="text"
      [value]="newMessage"
      (input)="onMessageChange($any($event.target).value)"
      [placeholder]="disabled ? 'You left this group' : 'Type a message...'"
      [disabled]="disabled"
      class="block w-full px-4 py-3 border border-gray-300 rounded-full leading-5 bg-white placeholder-gray-500 focus:outline-none focus:placeholder-gray-400 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm disabled:opacity-50 disabled:cursor-not-allowed disabled:bg-gray-100"
    />
  </div>

  <!-- Image Upload -->
  <label [class.pointer-events-none]="disabled" class="cursor-pointer">
    <input
      #fileInput
      type="file"
      accept="image/*"
      hidden
      (change)="onImageSelected($event)"
      [disabled]="disabled"
    />
    <svg 
      class="w-6 h-6 text-gray-600 hover:text-indigo-600 transition-colors"
      [class.opacity-50]="disabled"
      fill="none" 
      stroke="currentColor" 
      viewBox="0 0 24 24"
    >
      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
    </svg>
  </label>

  <!-- Video Upload -->
  <label [class.pointer-events-none]="disabled" class="cursor-pointer">
    <input
      #videoInput
      type="file"
      accept="video/*"
      hidden
      (change)="onVideoSelected($event)"
      [disabled]="disabled"
    />
    <svg 
      class="w-6 h-6 text-gray-600 hover:text-indigo-600 transition-colors"
      [class.opacity-50]="disabled"
      fill="none" 
      stroke="currentColor" 
      viewBox="0 0 24 24"
    >
      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
    </svg>
  </label>

  <!-- Send Button -->
  <button
    type="submit"
    [disabled]="!newMessage.trim() || disabled"
    class="inline-flex items-center justify-center w-10 h-10 bg-indigo-600 text-white rounded-full hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-200"
  >
    <svg
      class="w-5 h-5 transition-transform duration-300 ease-in-out"
      [class.rotate-89]="newMessage.trim()"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        strokeLinecap="round"
        strokeLinejoin="round"
        strokeWidth="2"
        d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"
      />
    </svg>
  </button>
</form>
